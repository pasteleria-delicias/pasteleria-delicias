<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear Cuenta - Pastelería</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&family=Pacifico&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    
    body {
      background: linear-gradient(135deg, #ffe6d9, #ffd6cc);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 20px;
    }

    /* Encabezado adaptado para verse grande en PC y perfecto en celular */
.header-text { text-align: center; margin-bottom: 30px; }

.header-text .icon-cupcake { 
  font-size: 4rem; /* Icono más grande */
  color: #d35400; 
  margin-bottom: 10px; 
}

.header-text h1 { 
  color: #7a3e2d; 
  font-size: 3rem; /* Letra más grande para PC */
  font-weight: 500; 
  line-height: 1.2; 
}

.header-text h1 span { 
  display: block; 
  font-family: 'Pacifico', cursive; 
  color: #ff6f61; 
  font-size: 5.5rem; /* "Pastelería" gigante para PC */
  font-weight: normal;
  margin-top: 0px;
}

.header-text p { 
  color: #777; 
  font-size: 1.5rem; /* Subtítulo más grande */
  margin-top: 15px; 
}

/* Ajuste para que en celulares se vea grandote pero sin salirse de la pantalla */
@media (max-width: 768px) {
  .header-text .icon-cupcake { font-size: 3rem; }
  .header-text h1 { font-size: 2rem; }
  .header-text h1 span { font-size: 4rem; } /* Tamaño ideal para el celular */
  .header-text p { font-size: 1.1rem; }
}

    /* Imagen del pastel */
    .card-image {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-radius: 20px;
      margin-bottom: 20px;
    }

    /* Campos de texto */
    .input-group { margin-bottom: 12px; }
    input {
      width: 100%;
      padding: 15px;
      border-radius: 15px;
      border: 1px solid #eee;
      background: #fafafa;
      outline: none;
      font-size: 1rem;
      transition: 0.3s;
    }
    input:focus { border-color: #f7b267; background: #fff; }

    /* Botón idéntico al de la imagen (Naranja/Amarillo) */
    .btn {
      width: 100%;
      padding: 16px;
      background: #f7b267;
      color: white;
      border: none;
      border-radius: 50px; 
      cursor: pointer;
      font-weight: 600;
      font-size: 1.1rem;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      box-shadow: 0 8px 20px rgba(247,178,103,0.3);
      transition: 0.2s;
      margin-top: 10px;
    }
    .btn:active { transform: scale(0.98); }

    /* Separador con corazón */
    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 20px 0 15px 0;
      color: #ff6f61;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid #ffd6cc;
    }
    .divider i { margin: 0 10px; font-size: 0.9rem; }

    /* Link inferior */
    .link { text-align: center; font-size: 0.9rem; color: #777; }
    .link a { color: #ff6f61; text-decoration: none; font-weight: bold; }
  </style>
</head>
<body>

<div class="header-text">
  <i class="fas fa-birthday-cake icon-cupcake"></i>
  <h1>Crea tu cuenta en <span>Pastelería</span></h1>
  <p>Únete para endulzar tu día 🍰</p>
</div>

<div class="card">
  <img src="https://images.unsplash.com/photo-1606313564200-e75d5e30476c" class="card-image" alt="Pastel">
  
  <div class="input-group">
    <input id="nombre" type="text" placeholder="Nombre completo">
  </div>
  <div class="input-group">
    <input id="correo" type="email" placeholder="Correo electrónico">
  </div>
  <div class="input-group">
    <input id="password" type="password" placeholder="Contraseña">
  </div>
  
  <button class="btn" onclick="registrar()">
    <i class="fas fa-user-plus"></i> Registrarse <i class="fas fa-arrow-right"></i>
  </button>
  
  <div class="divider"><i class="fas fa-heart"></i></div>
  
  <div class="link">
    ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
  </div>
</div>

<script>
  async function registrar() {
    const nombre = document.getElementById("nombre").value.trim();
    const correo = document.getElementById("correo").value.trim();
    const password = document.getElementById("password").value.trim();

    if (!nombre || !correo || !password) {
      alert("❌ Completa todos los campos");
      return;
    }

    try {
      const resRoles = await fetch("/roles");
      const roles = await resRoles.json();
      const rolCliente = roles.find(r => r.nombre === "Cliente");
      
      if (!rolCliente) {
        alert("Error interno: Rol no encontrado");
        return;
      }

      const res = await fetch("/registro", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nombre, correo, password, rolId: rolCliente._id })
      });

      const data = await res.text();
      alert(data);
      if (res.ok) {
        window.location.href = "login.html";
      }
    } catch (error) {
      alert("❌ Error de conexión");
    }
  }
</script>
</body>
</html>

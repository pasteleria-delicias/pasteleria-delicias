<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro - Pastelería</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body {
      background: linear-gradient(135deg, #ffe6d9, #ffd6cc);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      width: 900px;
      background: #fff;
      border-radius: 25px;
      overflow: hidden;
      box-shadow: 0 15px 40px rgba(0,0,0,0.2);
    }
    .left {
      background: url('https://images.unsplash.com/photo-1578985545062-69928b1d9587') center/cover;
      position: relative;
    }
    .left::after {
      content: "";
      position: absolute;
      width: 100%;
      height: 100%;
      background: rgba(255, 150, 150, 0.3);
    }
    .right { padding: 40px; text-align: center; }
    h2 { color: #7a3e2d; margin-bottom: 10px; }
    p { color: #777; margin-bottom: 20px; }
    input, select {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 10px;
      border: 1px solid #ddd;
      outline: none;
    }
    .btn {
      width: 100%;
      padding: 12px;
      background: #f7b267;
      color: white;
      border: none;
      border-radius: 10px;
      margin-top: 10px;
      cursor: pointer;
      font-weight: bold;
      font-size: 16px;
    }
    .btn:hover {
      background: #e09d46;
    }
    .link { margin-top: 15px; font-size: 14px; }
    .link a { color: #ff6f61; text-decoration: none; font-weight: bold; }
  </style>
</head>
<body>
<div class="container">
  <div class="left"></div>
  <div class="right">
    <h2>📝 Crear Cuenta</h2>
    <p>Únete a nuestra pastelería 🍰</p>
    <input id="nombre" type="text" placeholder="Nombre completo">
    <input id="correo" type="email" placeholder="Correo electrónico">
    <input id="password" type="password" placeholder="Contraseña">
    <select id="rol">
      <option value="">Cargando roles...</option>
    </select>
    <button class="btn" onclick="registrar()">Registrarse</button>
    <div class="link">
      ¿Ya tienes cuenta? <a href="login.html">Iniciar sesión</a>
    </div>
  </div>
</div>

<script>
  // Cargar roles desde el servidor
  async function cargarRoles() {
    try {
      const res = await fetch("/roles");
      const roles = await res.json();
      const select = document.getElementById("rol");
      select.innerHTML = '<option value="">Selecciona un rol</option>';
      roles.forEach(rol => {
        const option = document.createElement("option");
        option.value = rol._id;
        option.textContent = rol.nombre;
        select.appendChild(option);
      });
    } catch (error) {
      console.error("Error:", error);
      document.getElementById("rol").innerHTML = '<option value="">Error al cargar roles</option>';
    }
  }

  // Registrar usuario
  async function registrar() {
    const nombre = document.getElementById("nombre").value.trim();
    const correo = document.getElementById("correo").value.trim();
    const password = document.getElementById("password").value.trim();
    const rolId = document.getElementById("rol").value;

    if (!nombre || !correo || !password) {
      alert("❌ Por favor, completa todos los campos");
      return;
    }
    if (!rolId) {
      alert("❌ Por favor, selecciona un rol");
      return;
    }

    try {
      const res = await fetch("/registro", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nombre, correo, password, rolId })
      });
      const data = await res.text();
      alert(data);
      if (res.ok) {
        window.location.href = "login.html";
      }
    } catch (error) {
      alert("❌ Error de conexión: " + error.message);
    }
  }

  cargarRoles();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Administrador</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body { background: linear-gradient(135deg, #ffe6d9, #ffd6cc); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .container { width: 100%; max-width: 400px; background: #fff; border-radius: 25px; padding: 30px; box-shadow: 0 15px 40px rgba(0,0,0,0.2); }
    h2 { color: #7a3e2d; text-align: center; margin-bottom: 20px; }
    input, select { width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: 1px solid #ddd; outline: none; }
    .btn { width: 100%; padding: 12px; background: #f7b267; color: white; border: none; border-radius: 10px; margin-top: 15px; cursor: pointer; font-weight: bold; }
    .btn:hover { background: #e09d46; }
    .link { text-align: center; margin-top: 15px; font-size: 14px; }
    .link a { color: #ff6f61; text-decoration: none; font-weight: bold; }
  </style>
</head>
<body>
<div class="container">
  <h2>Crear Administrador</h2>
  <input id="nombre" type="text" placeholder="Nombre">
  <input id="correo" type="email" placeholder="Correo">
  <input id="password" type="password" placeholder="Contraseña">
  <select id="rol">
    <option value="">Cargando roles...</option>
  </select>
  <button class="btn" onclick="registrar()">Registrarse</button>
  <div class="link">
    ¿Ya tienes cuenta? <a href="/login.html">Iniciar sesión</a>
  </div>
</div>
<script>
  async function cargarRoles() {
    try {
      const res = await fetch("/roles");
      const roles = await res.json();
      const select = document.getElementById("rol");
      select.innerHTML = '<option value="">Selecciona un rol</option>';
      roles.forEach(rol => {
        const option = document.createElement("option");
        option.value = rol._id;
        option.textContent = rol.nombre;
        select.appendChild(option);
      });
    } catch (error) {
      document.getElementById("rol").innerHTML = '<option value="">Error al cargar roles</option>';
    }
  }
  async function registrar() {
    const nombre = document.getElementById("nombre").value.trim();
    const correo = document.getElementById("correo").value.trim();
    const password = document.getElementById("password").value.trim();
    const rolId = document.getElementById("rol").value;
    if (!nombre || !correo || !password || !rolId) { alert("Completa todos los campos"); return; }
    try {
      const res = await fetch("/registro", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nombre, correo, password, rolId })
      });
      const data = await res.text();
      alert(data);
      if (res.ok) window.location.href = "login.html";
    } catch (error) { alert("Error de conexión"); }
  }
  cargarRoles();
</script>
</body>
</html>

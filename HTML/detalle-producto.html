<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle del Producto - Pastelería</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body { background: linear-gradient(135deg, #ffe6d9, #ffd6cc); padding: 40px 20px; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    
    .container { 
      max-width: 1000px; 
      width: 100%;
      margin: auto; 
      background: white; 
      border-radius: 30px; 
      overflow: hidden; 
      box-shadow: 0 20px 50px rgba(0,0,0,0.1); 
    }
    
    .header { background: #fff9f7; padding: 20px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ffe0d4; }
    .logo h2 { color: #7a3e2d; }
    .logo span { color: #ff6f61; }
    .btn-volver { background: #f7b267; color: white; border: none; padding: 10px 20px; border-radius: 50px; cursor: pointer; font-weight: bold; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; transition: 0.2s; }
    .btn-volver:hover { background: #e09d46; }

    .detalle-content { display: flex; padding: 40px; gap: 40px; flex-wrap: wrap; }
    .detalle-imagen { flex: 1; text-align: center; min-width: 300px; }
    .detalle-imagen img { width: 100%; max-width: 400px; border-radius: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); object-fit: cover; height: 350px; }
    
    .detalle-info { flex: 1; min-width: 300px; display: flex; flex-direction: column; justify-content: center; }
    .detalle-info h1 { color: #7a3e2d; margin-bottom: 15px; font-size: 2.5rem; }
    .detalle-descripcion { color: #6b4e41; font-size: 1.1rem; line-height: 1.6; margin: 15px 0; }
    .detalle-precio { font-size: 2.5rem; color: #ff6f61; font-weight: bold; margin: 15px 0; }
    .detalle-stock { font-size: 1.1rem; color: #7a3e2d; background: #fff5f0; padding: 10px 20px; border-radius: 50px; display: inline-block; margin-bottom: 25px; }
    
    .btn-agregar { background: #ff6f61; color: white; border: none; padding: 18px; border-radius: 50px; cursor: pointer; font-weight: bold; font-size: 1.2rem; width: 100%; box-shadow: 0 8px 20px rgba(255,111,97,0.3); transition: 0.2s; display: flex; justify-content: center; align-items: center; gap: 10px; text-decoration: none; }
    .btn-agregar:hover { background: #e05a4f; }
    
    .footer { text-align: center; padding: 20px; background: #fff9f7; color: #aa8a7a; border-top: 2px solid #ffe0d4; }

    @media (max-width: 768px) {
      .detalle-content { flex-direction: column; padding: 20px; gap: 20px; }
      .detalle-imagen img { height: 250px; }
      .detalle-info h1 { font-size: 2rem; text-align: center; }
      .detalle-precio { text-align: center; }
      .detalle-stock { display: block; text-align: center; }
      .detalle-descripcion { text-align: center; }
      .header { flex-direction: column; gap: 10px; text-align: center; }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="logo"><h2>🍰 <span>Pastelería</span> Delicia</h2></div>
    <a href="/menu-publico" class="btn-volver"><i class="fas fa-arrow-left"></i> Volver al Menú</a>
  </div>
  
  <div class="detalle-content" id="detalleContent">
    <div style="text-align:center; width:100%; padding: 50px;"><i class="fas fa-spinner fa-pulse fa-2x"></i> Cargando producto...</div>
  </div>
  
  <div class="footer">❤️ Gracias por tu preferencia</div>
</div>

<script>
  async function cargarProducto() {
    const urlParams = new URLSearchParams(window.location.search);
    const id = urlParams.get('id');
    
    if (!id) {
      document.getElementById('detalleContent').innerHTML = '<div style="text-align:center; width:100%;">Producto no encontrado</div>';
      return;
    }
    
    try {
      // Hacemos la petición al backend usando la ruta relativa
      const res = await fetch(`/productos/${id}`);
      const producto = await res.json();
      
      document.getElementById('detalleContent').innerHTML = `
        <div class="detalle-imagen">
          <img src="${producto.imagenUrl || 'https://via.placeholder.com/400'}" onerror="this.src='https://via.placeholder.com/400'">
        </div>
        <div class="detalle-info">
          <h1>${producto.nombre}</h1>
          <div class="detalle-descripcion">${producto.descripcion}</div>
          <div class="detalle-precio">$${producto.precio.toFixed(2)}</div>
          <div class="detalle-stock"><i class="fas fa-box"></i> Stock disponible: ${producto.cantidad} unidades</div>
          
          <!-- Botón para ir a comprar (como es menú público, lo mandamos a iniciar sesión) -->
          <a href="/login.html" class="btn-agregar">
            <i class="fas fa-shopping-bag"></i> Inicia sesión para comprar
          </a>
        </div>
      `;
    } catch (error) {
      document.getElementById('detalleContent').innerHTML = '<div style="text-align:center; width:100%; color: #e74c3c;">Error al cargar el producto</div>';
    }
  }
  
  cargarProducto();
</script>
</body>
</html>

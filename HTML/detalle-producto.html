<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menú Pastelería - Delicia</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    
    body { 
      background: linear-gradient(135deg, #ffe6d9, #ffd6cc); 
      padding: 30px 20px; 
      min-height: 100vh;
    }
    
    /* Contenedor grande y elegante */
    .container { 
      max-width: 1400px; 
      margin: auto; 
      background: white; 
      border-radius: 30px; 
      padding: 40px; 
      box-shadow: 0 20px 50px rgba(0,0,0,0.1); 
    }
    
    /* Encabezado con línea divisoria */
    .menu-header { 
      text-align: center; 
      padding: 20px 0 30px 0;
      border-bottom: 2px solid #ffe0d4;
      margin-bottom: 30px;
    }
    .menu-header h1 { 
      color: #7a3e2d; 
      font-size: 3rem; 
      font-weight: 700;
    }
    .menu-header span { 
      color: #ff6f61; 
    }
    .menu-header p { 
      color: #8b6b5c; 
      font-size: 1.2rem;
      margin-top: 10px; 
    }
    
    /* Botones de navegación */
    .nav-bar {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 20px 0 30px 0;
      flex-wrap: wrap;
    }
    .nav-bar a {
      text-decoration: none;
      padding: 10px 25px;
      border-radius: 40px;
      font-weight: 500;
      color: #7a3e2d;
      background: #fff0e8;
      transition: 0.3s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .nav-bar a:hover {
      background: #ff6f61;
      color: white;
    }
    .nav-bar a.active {
      background: #ff6f61;
      color: white;
    }
    
    /* Cuadrícula de 3 columnas */
    .productos-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 35px;
      margin-top: 10px;
    }
    
    /* Tarjetas de producto */
    .producto-card {
      background: #fffefc;
      border-radius: 25px;
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(0,0,0,0.06);
      transition: transform 0.3s, box-shadow 0.3s;
      border: 1px solid #f5e8e0;
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    .producto-card:hover { 
      transform: translateY(-8px); 
      box-shadow: 0 15px 40px rgba(122,62,45,0.12);
    }
    
    /* Imagen grande */
    .producto-img { 
      width: 100%; 
      height: 240px; 
      object-fit: cover; 
    }
    
    .producto-info { 
      padding: 22px; 
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    
    .producto-nombre { 
      font-size: 1.3rem; 
      font-weight: 700; 
      color: #7a3e2d; 
      margin-bottom: 6px; 
    }
    
    .producto-descripcion { 
      color: #6b4e41; 
      font-size: 0.95rem; 
      line-height: 1.5;
      margin: 8px 0 12px 0;
      flex: 1;
    }
    
    /* Precio y stock en píldora */
    .precio-stock { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-top: 12px; 
      background: #fff5f0; 
      padding: 12px 18px; 
      border-radius: 50px;
    }
    .producto-precio { 
      font-weight: 700; 
      color: #ff6f61; 
      font-size: 1.4rem; 
    }
    .producto-stock { 
      font-size: 0.85rem; 
      color: #7a3e2d; 
      background: white; 
      padding: 6px 16px; 
      border-radius: 30px;
    }
    
    .footer { 
      text-align: center; 
      margin-top: 50px; 
      padding-top: 25px; 
      color: #aa8a7a; 
      border-top: 2px solid #ffe0d4;
      font-size: 1rem;
    }
    .footer i { color: #ff6f61; }
    
    /* Adaptación a pantallas */
    @media (max-width: 1024px) {
      .container { padding: 25px; }
      .productos-grid { gap: 25px; }
      .producto-img { height: 200px; }
      .menu-header h1 { font-size: 2.5rem; }
    }
    
    @media (max-width: 850px) {
      .productos-grid { grid-template-columns: repeat(2, 1fr); gap: 20px; }
      .producto-img { height: 200px; }
    }
    
    @media (max-width: 550px) {
      .container { padding: 15px; border-radius: 20px; }
      .productos-grid { grid-template-columns: 1fr; }
      .producto-img { height: 220px; }
      .menu-header h1 { font-size: 2rem; }
      .nav-bar { gap: 10px; }
      .nav-bar a { padding: 8px 16px; font-size: 0.9rem; }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="menu-header">
    <h1>🍰 Pastelería <span>Delicia</span></h1>
    <p>Los postres más deliciosos, hechos con amor 💕</p>
  </div>

  <!-- Botones de navegación -->
  <div class="nav-bar">
    <a href="/"><i class="fas fa-home"></i> Inicio</a>
    <a href="/menu-publico" class="active"><i class="fas fa-utensils"></i> Nuestro Menú</a>
  </div>

  <div id="productosContainer" class="productos-grid">
    <div style="text-align:center; grid-column: span 3; padding: 40px; color: #aa8a7a;">
      <i class="fas fa-spinner fa-pulse"></i> Cargando menú...
    </div>
  </div>

  <div class="footer">
    <i class="fas fa-heart"></i> Gracias por visitarnos
  </div>
</div>

<script>
  fetch('/productos')
    .then(res => res.json())
    .then(productos => {
      const cont = document.getElementById('productosContainer');
      if (productos.length === 0) {
        cont.innerHTML = '<div style="text-align:center; grid-column: span 3; padding: 40px;">Pronto tendremos nuevos productos...</div>';
        return;
      }
      cont.innerHTML = productos.map(p => `
        <div class="producto-card">
          <img class="producto-img" src="${p.imagenUrl || 'https://via.placeholder.com/400x240?text=Pastel'}" 
               onerror="this.src='https://via.placeholder.com/400x240?text=Postre'">
          <div class="producto-info">
            <div class="producto-nombre">${escapeHtml(p.nombre)}</div>
            <div class="producto-descripcion">${escapeHtml(p.descripcion)}</div>
            <div class="precio-stock">
              <span class="producto-precio">$${p.precio.toFixed(2)}</span>
              <span class="producto-stock"><i class="fas fa-box"></i> ${p.cantidad} disponibles</span>
            </div>
          </div>
        </div>
      `).join('');
    })
    .catch(err => {
      document.getElementById('productosContainer').innerHTML = 
        '<div style="text-align:center; grid-column: span 3; padding: 40px; color: #e74c3c;">Error al cargar el menú. Intenta más tarde.</div>';
    });

  function escapeHtml(str) {
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administrar - Pastelería</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&family=Pacifico&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body { background: linear-gradient(135deg, #ffe6d9, #ffd6cc); min-height: 100vh; padding: 20px; display: flex; flex-direction: column; align-items: center; }
    
    .app-container { width: 100%; max-width: 1100px; }
    
    .header-text { text-align: center; margin-bottom: 20px; }
    .header-text h1 { color: #7a3e2d; font-size: 1.5rem; }
    .header-text h1 span { display: block; font-family: 'Pacifico', cursive; color: #ff6f61; font-size: 3rem; margin-top: -5px; font-weight: normal; }
    
    .nav-bar { display: flex; justify-content: center; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; }
    .nav-bar a { text-decoration: none; padding: 10px 20px; border-radius: 50px; background: #fff; color: #7a3e2d; font-weight: 500; box-shadow: 0 4px 10px rgba(0,0,0,0.05); transition: 0.3s; }
    .nav-bar a:hover, .nav-bar a.active { background: #ff6f61; color: white; }

    .acciones-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;}
    
    .btn-agregar { background: #f7b267; color: white; border: none; padding: 12px 25px; border-radius: 50px; font-weight: bold; cursor: pointer; box-shadow: 0 5px 15px rgba(247,178,103,0.3); transition: 0.2s;}
    .btn-agregar:hover { background: #e09d46; }
    
    /* Botón para crear personal */
    .btn-personal { background: #7a3e2d; color: white; border: none; padding: 12px 25px; border-radius: 50px; font-weight: bold; cursor: pointer; box-shadow: 0 5px 15px rgba(122,62,45,0.3); transition: 0.2s; }
    .btn-personal:hover { background: #5c2e21; }

    .productos-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .producto-card { background: #fff; border-radius: 25px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.08); display: flex; flex-direction: column; }
    .producto-img { width: 100%; height: 150px; object-fit: cover; }
    .producto-info { padding: 20px; display: flex; flex-direction: column; flex: 1; }
    .producto-nombre { font-size: 1.1rem; font-weight: bold; color: #7a3e2d; }
    .producto-precio { color: #ff6f61; font-weight: bold; font-size: 1.2rem; margin: 5px 0; }
    .producto-stock { color: #777; font-size: 0.8rem; margin-bottom: 15px; }
    .acciones { display: flex; gap: 10px; margin-top: auto; }
    .acciones button { flex: 1; padding: 10px; border: none; border-radius: 50px; cursor: pointer; font-weight: bold; color: white; }
    .editar { background: #f7b267; }
    .eliminar { background: #e74c3c; }
    
    /* MODALES */
    .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
    .modal-contenido { background: #fff; padding: 25px; border-radius: 30px; width: 90%; max-width: 400px; max-height: 90vh; overflow-y: auto;}
    .modal-contenido h2 { color: #7a3e2d; margin-bottom: 15px; text-align: center; }
    .modal-contenido input, .modal-contenido textarea, .modal-contenido select { width: 100%; padding: 15px; margin: 8px 0; border-radius: 15px; border: 1px solid #eee; background: #fafafa; outline: none; font-size: 1rem;}
    .modal-contenido button { width: 100%; padding: 15px; background: #ff6f61; color: white; border: none; border-radius: 50px; margin-top: 15px; cursor: pointer; font-weight: bold; }
    .cerrar { background: #aaa !important; }

    @media (max-width: 850px) { .productos-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 600px) { .productos-grid { grid-template-columns: 1fr; } .header-text h1 span { font-size: 2.5rem; } .acciones-top { flex-direction: column; align-items: stretch; } }
  </style>
</head>
<body>
<div class="app-container">
  <div class="header-text"><h1>Panel de <span>Administración</span></h1></div>
  
  <div class="nav-bar">
    <a href="/"><i class="fas fa-home"></i> Inicio</a>
    <a href="/menu-publico"><i class="fas fa-utensils"></i> Menú</a>
    <a href="/reporte"><i class="fas fa-chart-bar"></i> Rep. Productos</a>
    <a href="/reporte-ventas"><i class="fas fa-chart-line"></i> Rep. Ventas</a>
    <a href="/admin" class="active"><i class="fas fa-cog"></i> Admin</a>
  </div>

  <div class="acciones-top">
    <h2 style="color: #7a3e2d;">Mis Productos</h2>
    <div style="display: flex; gap: 10px; flex-wrap: wrap;">
      <button class="btn-personal" onclick="abrirModalAdmin()"><i class="fas fa-user-shield"></i> Crear Admin/Trabajador</button>
      <button class="btn-agregar" onclick="abrirModal()"><i class="fas fa-plus"></i> Nuevo Producto</button>
    </div>
  </div>

  <div id="productosContainer" class="productos-grid"></div>
</div>

<!-- MODAL PARA PRODUCTOS -->
<div id="modal" class="modal">
  <div class="modal-contenido">
    <h2 id="modalTitulo">Producto</h2>
    <input type="text" id="productoId" hidden>
    <input type="text" id="nombre" placeholder="Nombre del producto">
    <textarea id="descripcion" placeholder="Descripción" rows="2"></textarea>
    <input type="number" id="precio" placeholder="Precio" step="0.01">
    <input type="number" id="cantidad" placeholder="Cantidad (Límite máximo)">
    <input type="text" id="imagenUrl" placeholder="URL de la imagen">
    <button onclick="guardarProducto()">Guardar Producto</button>
    <button class="cerrar" onclick="cerrarModal()">Cancelar</button>
  </div>
</div>

<!-- NUEVO MODAL PARA CREAR ADMINISTRADORES/TRABAJADORES -->
<div id="modalAdmin" class="modal">
  <div class="modal-contenido">
    <h2>👑 Crear Nuevo Personal</h2>
    <input type="text" id="adminNombre" placeholder="Nombre completo">
    <input type="email" id="adminCorreo" placeholder="Correo electrónico">
    <input type="password" id="adminPassword" placeholder="Contraseña">
    <select id="adminRol">
      <option value="">Cargando roles...</option>
    </select>
    <button onclick="crearPersonal()">Registrar Personal</button>
    <button class="cerrar" onclick="cerrarModalAdmin()">Cancelar</button>
  </div>
</div>

<script>
  let productos = [];
  
  // ========== LÓGICA DE PRODUCTOS ==========
  async function cargar() {
    const res = await fetch('/productos'); 
    productos = await res.json();
    document.getElementById('productosContainer').innerHTML = productos.map(p => `
      <div class="producto-card">
        <img class="producto-img" src="${p.imagenUrl || 'https://via.placeholder.com/300x150'}" onerror="this.src='https://via.placeholder.com/300x150'">
        <div class="producto-info">
          <div class="producto-nombre">${p.nombre}</div>
          <div class="producto-precio">$${p.precio.toFixed(2)}</div>
          <div class="producto-stock"><i class="fas fa-box"></i> Stock: ${p.cantidad}</div>
          <div class="acciones">
            <button class="editar" onclick="editar('${p._id}')">Editar</button>
            <button class="eliminar" onclick="eliminar('${p._id}')">Eliminar</button>
          </div>
        </div>
      </div>
    `).join('');
  }

  function abrirModal() {
    document.getElementById('modalTitulo').innerText = 'Nuevo Producto';
    document.getElementById('productoId').value = '';
    document.getElementById('nombre').value = ''; document.getElementById('descripcion').value = '';
    document.getElementById('precio').value = ''; document.getElementById('cantidad').value = ''; document.getElementById('imagenUrl').value = '';
    document.getElementById('modal').style.display = 'flex';
  }
  function cerrarModal() { document.getElementById('modal').style.display = 'none'; }
  
  async function guardarProducto() {
    const id = document.getElementById('productoId').value;
    const body = {
      nombre: document.getElementById('nombre').value, descripcion: document.getElementById('descripcion').value,
      precio: parseFloat(document.getElementById('precio').value), cantidad: parseInt(document.getElementById('cantidad').value),
      imagenUrl: document.getElementById('imagenUrl').value
    };
    if (id) { await fetch('/productos/' + id, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }); }
    else { await fetch('/productos', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }); }
    cerrarModal(); cargar();
  }
  async function editar(id) {
    const p = productos.find(x => x._id === id);
    document.getElementById('modalTitulo').innerText = 'Editar Producto';
    document.getElementById('productoId').value = p._id;
    document.getElementById('nombre').value = p.nombre; document.getElementById('descripcion').value = p.descripcion;
    document.getElementById('precio').value = p.precio; document.getElementById('cantidad').value = p.cantidad; document.getElementById('imagenUrl').value = p.imagenUrl;
    document.getElementById('modal').style.display = 'flex';
  }
  async function eliminar(id) { if (confirm('¿Eliminar producto?')) { await fetch('/productos/' + id, { method: 'DELETE' }); cargar(); } }
  
  cargar();

  // ========== LÓGICA PARA CREAR ADMINISTRADORES ==========
  async function abrirModalAdmin() {
    document.getElementById('modalAdmin').style.display = 'flex';
    // Cargar los roles en el select
    try {
      const res = await fetch("/roles");
      const roles = await res.json();
      const select = document.getElementById("adminRol");
      select.innerHTML = '<option value="">Selecciona un rol</option>';
      roles.forEach(rol => {
        const option = document.createElement("option");
        option.value = rol._id;
        option.textContent = rol.nombre;
        select.appendChild(option);
      });
    } catch (error) {
      document.getElementById("adminRol").innerHTML = '<option value="">Error al cargar roles</option>';
    }
  }

  function cerrarModalAdmin() { document.getElementById('modalAdmin').style.display = 'none'; }

  async function crearPersonal() {
    const nombre = document.getElementById('adminNombre').value.trim();
    const correo = document.getElementById('adminCorreo').value.trim();
    const password = document.getElementById('adminPassword').value.trim();
    const rolId = document.getElementById('adminRol').value;

    if (!nombre || !correo || !password || !rolId) {
      alert("❌ Completa todos los campos y selecciona un rol");
      return;
    }

    try {
      const res = await fetch("/registro", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nombre, correo, password, rolId })
      });
      const data = await res.text();
      alert(data);
      if (res.ok) {
        cerrarModalAdmin();
        document.getElementById('adminNombre').value = '';
        document.getElementById('adminCorreo').value = '';
        document.getElementById('adminPassword').value = '';
      }
    } catch (error) {
      alert("❌ Error de conexión");
    }
  }
</script>
</body>
</html>

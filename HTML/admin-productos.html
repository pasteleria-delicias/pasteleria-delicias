<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Administrar Productos - Pastelería</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body { background: linear-gradient(135deg, #ffe6d9, #ffd6cc); padding: 40px 20px; }
    .container { max-width: 1200px; margin: auto; background: white; border-radius: 25px; padding: 30px; box-shadow: 0 15px 40px rgba(0,0,0,0.1); }
    h1 { color: #7a3e2d; text-align: center; margin-bottom: 20px; }
    .btn-agregar { background: #ff6f61; color: white; border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer; margin-bottom: 20px; font-weight: bold; }
    .productos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px,1fr)); gap: 20px; }
    .producto-card { background: #fff9f7; border-radius: 15px; padding: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
    .producto-img { width: 100%; height: 150px; object-fit: cover; border-radius: 10px; margin-bottom: 10px; }
    .producto-nombre { font-size: 1.2rem; font-weight: bold; color: #7a3e2d; }
    .producto-descripcion { color: #555; margin: 8px 0; }
    .producto-precio { color: #ff6f61; font-weight: bold; font-size: 1.1rem; }
    .acciones { margin-top: 15px; display: flex; gap: 10px; }
    .acciones button { flex: 1; padding: 6px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
    .editar { background: #f7b267; color: white; }
    .eliminar { background: #e74c3c; color: white; }
    .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
    .modal-contenido { background: white; padding: 25px; border-radius: 20px; width: 90%; max-width: 500px; }
    .modal-contenido h2 { color: #7a3e2d; margin-bottom: 15px; }
    .modal-contenido input, .modal-contenido textarea { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; }
    .modal-contenido button { width: 100%; padding: 10px; background: #ff6f61; color: white; border: none; border-radius: 8px; margin-top: 10px; cursor: pointer; }
    .cerrar { background: #aaa !important; }
  /* DISEÑO PARA CELULARES Y TABLETS */
@media (max-width: 1024px) {
  .productos-grid { grid-template-columns: repeat(2, 1fr); } 
}
@media (max-width: 768px) {
  .productos-grid { grid-template-columns: 1fr; } 
  .header { flex-direction: column; text-align: center; }
  .nav-buttons { justify-content: center; }
  .titulo-seccion { flex-direction: column; gap: 10px; align-items: stretch; }
}
  </style>
</head>
<body>
<div class="container">
  <h1>🍰 Administrar Catálogo</h1>
  <button class="btn-agregar" id="btnAgregar">+ Agregar Producto</button>
  <div id="productosContainer" class="productos-grid"></div>
</div>
<div id="modal" class="modal">
  <div class="modal-contenido">
    <h2 id="modalTitulo">Producto</h2>
    <input type="text" id="productoId" hidden>
    <input type="text" id="nombre" placeholder="Nombre">
    <textarea id="descripcion" placeholder="Descripción" rows="3"></textarea>
    <input type="number" id="precio" placeholder="Precio" step="0.01">
    <input type="number" id="cantidad" placeholder="Cantidad">
    <input type="text" id="imagenUrl" placeholder="URL de imagen (opcional)">
    <button id="btnGuardar">Guardar</button>
    <button class="cerrar" id="btnCancelar">Cancelar</button>
  </div>
</div>
<script>
  const API = '/productos';
  let productos = [];

  async function cargar() {
    const res = await fetch(API);
    productos = await res.json();
    const container = document.getElementById('productosContainer');
    if (productos.length === 0) {
      container.innerHTML = '<p style="text-align:center">No hay productos. ¡Agrega uno!</p>';
      return;
    }
    container.innerHTML = productos.map(p => `
      <div class="producto-card">
        <img class="producto-img" src="${p.imagenUrl || 'https://picsum.photos/300/150?random=1'}" onerror="this.src='https://picsum.photos/300/150?random=2'">
        <div class="producto-nombre">${escapeHtml(p.nombre)}</div>
        <div class="producto-descripcion">${escapeHtml(p.descripcion)}</div>
        <div class="producto-precio">$${p.precio.toFixed(2)}</div>
        <div>📦 Stock: ${p.cantidad}</div>
        <div class="acciones">
          <button class="editar" onclick="editar('${p._id}')">Editar</button>
          <button class="eliminar" onclick="eliminar('${p._id}')">Eliminar</button>
        </div>
      </div>
    `).join('');
  }

  function escapeHtml(str) {
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }

  async function editar(id) {
    const p = productos.find(x => x._id === id);
    if (!p) return;
    document.getElementById('modalTitulo').innerText = '✏️ Editar Producto';
    document.getElementById('productoId').value = p._id;
    document.getElementById('nombre').value = p.nombre;
    document.getElementById('descripcion').value = p.descripcion;
    document.getElementById('precio').value = p.precio;
    document.getElementById('cantidad').value = p.cantidad;
    document.getElementById('imagenUrl').value = p.imagenUrl || '';
    document.getElementById('modal').style.display = 'flex';
  }

  async function eliminar(id) {
    if (confirm('¿Eliminar este producto permanentemente?')) {
      await fetch(`${API}/${id}`, { method: 'DELETE' });
      cargar();
    }
  }

  document.getElementById('btnAgregar').onclick = () => {
    document.getElementById('modalTitulo').innerText = '🍰 Nuevo Producto';
    document.getElementById('productoId').value = '';
    document.getElementById('nombre').value = '';
    document.getElementById('descripcion').value = '';
    document.getElementById('precio').value = '';
    document.getElementById('cantidad').value = '';
    document.getElementById('imagenUrl').value = '';
    document.getElementById('modal').style.display = 'flex';
  };

  document.getElementById('btnGuardar').onclick = async () => {
    const id = document.getElementById('productoId').value;
    const body = {
      nombre: document.getElementById('nombre').value.trim(),
      descripcion: document.getElementById('descripcion').value.trim(),
      precio: parseFloat(document.getElementById('precio').value),
      cantidad: parseInt(document.getElementById('cantidad').value),
      imagenUrl: document.getElementById('imagenUrl').value.trim()
    };
    if (!body.nombre || !body.descripcion || isNaN(body.precio) || isNaN(body.cantidad)) {
      alert('Completa todos los campos obligatorios');
      return;
    }
    if (id) {
      await fetch(`${API}/${id}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    } else {
      await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    }
    cargar();
    document.getElementById('modal').style.display = 'none';
  };

  document.getElementById('btnCancelar').onclick = () => {
    document.getElementById('modal').style.display = 'none';
  };
  window.onclick = (e) => { if (e.target === document.getElementById('modal')) document.getElementById('modal').style.display = 'none'; };

  cargar();
</script>
</body>
</html>

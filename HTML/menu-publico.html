<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuestro Menú - Pastelería</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&family=Pacifico&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body { background: linear-gradient(135deg, #ffe6d9, #ffd6cc); min-height: 100vh; padding: 20px; display: flex; flex-direction: column; align-items: center; }
    .app-container { width: 100%; max-width: 1100px; }
    .header-text { text-align: center; margin-bottom: 20px; }
    .header-text h1 { color: #7a3e2d; font-size: 1.5rem; }
    .header-text h1 span { display: block; font-family: 'Pacifico', cursive; color: #ff6f61; font-size: 3rem; margin-top: -5px; font-weight: normal; }
    .nav-bar { display: flex; justify-content: center; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; }
    .nav-bar a { text-decoration: none; padding: 10px 20px; border-radius: 50px; background: #fff; color: #7a3e2d; font-weight: 500; box-shadow: 0 4px 10px rgba(0,0,0,0.05); transition: 0.3s; }
    .nav-bar a:hover, .nav-bar a.active { background: #ff6f61; color: white; }
    .productos-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .producto-card { background: #fff; border-radius: 25px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.08); display: flex; flex-direction: column; transition: transform 0.2s; }
    .producto-card:hover { transform: translateY(-5px); }
    .producto-img { width: 100%; height: 180px; object-fit: cover; }
    .producto-info { padding: 20px; display: flex; flex-direction: column; flex: 1; }
    .producto-nombre { font-size: 1.2rem; font-weight: bold; color: #7a3e2d; }
    .producto-descripcion { color: #777; font-size: 0.9rem; margin: 8px 0; flex: 1; }
    .precio-stock { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; background: #fafafa; padding: 10px 15px; border-radius: 15px; }
    .producto-precio { font-weight: 700; color: #ff6f61; font-size: 1.3rem; }
    .producto-stock { font-size: 0.8rem; color: #7a3e2d; font-weight: 500; }
    .footer { text-align: center; margin-top: 40px; color: #7a3e2d; font-size: 0.9rem; }
    @media (max-width: 850px) { .productos-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 600px) { .productos-grid { grid-template-columns: 1fr; } .header-text h1 span { font-size: 2.5rem; } }
  </style>
</head>
<body>
<div class="app-container">
  <div class="header-text">
    <h1>Bienvenido a la <span>Pastelería</span></h1>
  </div>
  <div class="nav-bar">
    <a href="/" class="active"><i class="fas fa-utensils"></i> Menú</a>
  </div>
  <div id="productosContainer" class="productos-grid">
    <p style="grid-column: 1/-1; text-align: center;">Cargando delicias...</p>
  </div>
  <div class="footer">
    <i class="fas fa-heart" style="color: #ff6f61;"></i> Gracias por visitarnos
  </div>
</div>
<script>
  fetch('/productos').then(res => res.json()).then(productos => {
    const cont = document.getElementById('productosContainer');
    if (productos.length === 0) { cont.innerHTML = '<p style="grid-column: 1/-1; text-align: center;">Pronto tendremos nuevos productos...</p>'; return; }
    cont.innerHTML = productos.map(p => `
      <div class="producto-card">
        <img class="producto-img" src="${p.imagenUrl || 'https://via.placeholder.com/300x200?text=Pastel'}" onerror="this.src='https://via.placeholder.com/300x200?text=Pastel'">
        <div class="producto-info">
          <div class="producto-nombre">${p.nombre}</div>
          <div class="producto-descripcion">${p.descripcion}</div>
          <div class="precio-stock">
            <span class="producto-precio">$${p.precio.toFixed(2)}</span>
            <span class="producto-stock"><i class="fas fa-box"></i> ${p.cantidad}</span>
          </div>
        </div>
      </div>
    `).join('');
  });
</script>
</body>
</html>

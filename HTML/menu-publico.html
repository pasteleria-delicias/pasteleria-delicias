<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menú Pastelería - Delicia</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body { background: linear-gradient(135deg, #ffe6d9, #ffd6cc); padding: 20px; min-height: 100vh; display: flex; flex-direction: column; align-items: center;}
    
    .container { 
      max-width: 1200px; 
      width: 100%;
      background: white; 
      border-radius: 30px; 
      padding: clamp(20px, 4vw, 40px); 
      box-shadow: 0 20px 50px rgba(0,0,0,0.1); 
    }
    
    .menu-header { text-align: center; padding: 10px 0 20px 0; border-bottom: 2px solid #ffe0d4; margin-bottom: 20px; }
    .menu-header h1 { color: #7a3e2d; font-size: clamp(2rem, 5vw, 3rem); font-weight: 700; }
    .menu-header span { color: #ff6f61; }
    .menu-header p { color: #8b6b5c; font-size: clamp(1rem, 2vw, 1.2rem); margin-top: 10px; }
    
    .nav-bar { display: flex; justify-content: center; gap: 15px; margin-bottom: 25px; flex-wrap: wrap; }
    .nav-bar a { text-decoration: none; padding: clamp(8px, 1vw, 10px) clamp(15px, 2vw, 25px); border-radius: 40px; font-weight: 500; color: #7a3e2d; background: #fff0e8; transition: 0.3s; font-size: clamp(0.9rem, 2vw, 1rem); }
    .nav-bar a:hover, .nav-bar a.active { background: #ff6f61; color: white; }
    
    /* GRID MÁGICO: Se adapta solo sin necesidad de @media */
    .productos-grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); 
      gap: 20px; 
    }
    
    .producto-card { background: #fffefc; border-radius: 25px; overflow: hidden; box-shadow: 0 8px 25px rgba(0,0,0,0.06); border: 1px solid #f5e8e0; display: flex; flex-direction: column; cursor: pointer; transition: transform 0.3s; }
    .producto-card:hover { transform: translateY(-5px); }
    .producto-img { width: 100%; height: clamp(150px, 20vw, 200px); object-fit: cover; }
    
    .producto-info { padding: clamp(15px, 2vw, 20px); display: flex; flex-direction: column; flex: 1; }
    .producto-nombre { font-size: clamp(1.1rem, 2vw, 1.3rem); font-weight: 700; color: #7a3e2d; }
    .producto-descripcion { color: #6b4e41; font-size: clamp(0.8rem, 1.5vw, 0.95rem); margin: 8px 0; flex: 1; }
    
    .precio-stock { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; background: #fff5f0; padding: 10px 15px; border-radius: 50px; }
    .producto-precio { font-weight: 700; color: #ff6f61; font-size: clamp(1.1rem, 2vw, 1.4rem); }
    .producto-stock { font-size: clamp(0.7rem, 1.5vw, 0.85rem); color: #7a3e2d; background: white; padding: 4px 12px; border-radius: 30px; font-weight: bold; }
    
    .footer { text-align: center; margin-top: 30px; color: #aa8a7a; font-size: clamp(0.8rem, 1.5vw, 1rem); border-top: 2px solid #ffe0d4; padding-top: 15px; }
  </style>
</head>
<body>
<div class="container">
  <div class="menu-header">
    <h1>🍰 Pastelería <span>Delicia</span></h1>
    <p>Los postres más deliciosos, hechos con amor 💕</p>
  </div>
  <div class="nav-bar">
    <a href="/"><i class="fas fa-home"></i> Inicio</a>
    <a href="/menu-publico" class="active"><i class="fas fa-utensils"></i> Nuestro Menú</a>
  </div>
  <div id="productosContainer" class="productos-grid">
    <div style="text-align:center; grid-column: 1/-1; padding: 40px; color: #aa8a7a;"><i class="fas fa-spinner fa-pulse"></i> Cargando menú...</div>
  </div>
  <div class="footer"><i class="fas fa-heart"></i> Gracias por visitarnos</div>
</div>
<script>
  function verDetalle(id) { window.location.href = `detalle-producto.html?id=${id}`; }
  fetch('/productos').then(res => res.json()).then(productos => {
    const cont = document.getElementById('productosContainer');
    if (productos.length === 0) { cont.innerHTML = '<div style="text-align:center; grid-column: 1/-1; padding: 40px;">Pronto tendremos nuevos productos...</div>'; return; }
    
    const productosAMostrar = productos.slice(0, 6);
    cont.innerHTML = productosAMostrar.map(p => `
      <div class="producto-card" onclick="verDetalle('${p._id}')">
        <img class="producto-img" src="${p.imagenUrl || 'https://via.placeholder.com/400x240?text=Pastel'}" onerror="this.src='https://via.placeholder.com/400x240?text=Postre'">
        <div class="producto-info">
          <div class="producto-nombre">${escapeHtml(p.nombre)}</div>
          <div class="producto-descripcion">${escapeHtml(p.descripcion)}</div>
          <div class="precio-stock">
            <span class="producto-precio">$${p.precio.toFixed(2)}</span>
            <span class="producto-stock"><i class="fas fa-box"></i> ${p.cantidad} disponibles</span>
          </div>
        </div>
      </div>
    `).join('');
  }).catch(err => {
    document.getElementById('productosContainer').innerHTML = '<div style="text-align:center; grid-column: 1/-1; padding: 40px; color: #e74c3c;">Error al cargar el menú.</div>';
  });
  function escapeHtml(str) { return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;'); }
</script>
</body>
</html>

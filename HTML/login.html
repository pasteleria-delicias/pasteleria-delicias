<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - Pastelería</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    
    body {
      background: linear-gradient(135deg, #ffe6d9, #ffd6cc);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* Tarjeta blanca central */
    .card {
      background: #fff;
      width: 100%;
      max-width: 420px;
      border-radius: 35px;
      padding: 30px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.1);
      text-align: center;
    }

    /* Imagen del pastel arriba */
    .top-image {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 20px;
      margin-bottom: 20px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    h2 { color: #7a3e2d; font-size: 2rem; margin-bottom: 5px; }
    p { color: #777; margin-bottom: 25px; font-size: 1rem; }

    /* Campos de texto grandes */
    input {
      width: 100%;
      padding: 16px;
      margin: 10px 0;
      border-radius: 15px;
      border: 1px solid #eee;
      background: #fafafa;
      outline: none;
      font-size: 1.05rem;
      transition: 0.3s;
    }
    input:focus { border-color: #ff6f61; background: #fff; }

    /* Botón grande estilo App */
    .btn {
      width: 100%;
      padding: 16px;
      background: #ff6f61;
      color: white;
      border: none;
      border-radius: 30px;
      margin-top: 15px;
      cursor: pointer;
      font-weight: bold;
      font-size: 1.1rem;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      box-shadow: 0 8px 20px rgba(255,111,97,0.3);
      transition: 0.3s;
    }
    .btn:active { transform: scale(0.98); }

    .link { margin-top: 25px; font-size: 0.95rem; color: #777; }
    .link a { color: #ff6f61; text-decoration: none; font-weight: bold; }
  </style>
</head>
<body>

<div class="card">
  <img src="https://images.unsplash.com/photo-1578985545062-69928b1d9587" class="top-image" alt="Pastel">
  
  <h2>Iniciar Sesión</h2>
  <p>¡Bienvenido de nuevo! 🍰</p>
  
  <input type="email" id="correo" placeholder="Correo electrónico">
  <input type="password" id="password" placeholder="Contraseña">
  
  <button class="btn" onclick="iniciarSesion()">
    Entrar <i class="fas fa-arrow-right"></i>
  </button>
  
  <div class="link">
    ¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a>
  </div>
</div>

<script>
  async function iniciarSesion() {
    const correo = document.getElementById("correo").value.trim();
    const password = document.getElementById("password").value.trim();

    if (!correo || !password) {
      alert("❌ Completa todos los campos");
      return;
    }

    try {
      const res = await fetch("/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ correo, password })
      });

      if (res.ok) {
        const data = await res.json();
        alert(data.mensaje);
        localStorage.setItem("usuario", JSON.stringify({
          nombre: data.nombre,
          rol: data.rol,
          correo: correo
        }));
        if (data.rol === "Administrador") {
          window.location.href = "/admin";
        } else {
          window.location.href = "/cliente";
        }
      } else {
        const error = await res.json();
        alert("❌ " + (error.error || "Credenciales incorrectas"));
      }
    } catch (error) {
      alert("❌ Error de conexión con el servidor");
    }
  }
</script>
</body>
</html>

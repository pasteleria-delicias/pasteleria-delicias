<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Login - Pastelería</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body {
      background: linear-gradient(135deg, #ffe6d9, #ffd6cc);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      width: 900px;
      background: #fff;
      border-radius: 25px;
      overflow: hidden;
      box-shadow: 0 15px 40px rgba(0,0,0,0.2);
    }
    .left {
      background: url('https://images.unsplash.com/photo-1559622214-f8a9850965bb') center/cover;
      position: relative;
    }
    .left::after {
      content: "";
      position: absolute;
      width: 100%;
      height: 100%;
      background: rgba(255, 150, 150, 0.3);
    }
    .right { padding: 40px; text-align: center; }
    h2 { color: #7a3e2d; margin-bottom: 10px; }
    p { color: #777; margin-bottom: 20px; }
    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 10px;
      border: 1px solid #ddd;
      outline: none;
    }
    .btn {
      width: 100%;
      padding: 12px;
      background: #ff6f61;
      color: white;
      border: none;
      border-radius: 10px;
      margin-top: 10px;
      cursor: pointer;
      font-weight: bold;
      font-size: 16px;
    }
    .btn:hover {
      background: #e05a4f;
    }
    .link { margin-top: 15px; font-size: 14px; }
    .link a { color: #ff6f61; text-decoration: none; font-weight: bold; }
  </style>
</head>
<body>
<div class="container">
  <div class="left"></div>
  <div class="right">
    <h2>🔐 Iniciar Sesión</h2>
    <p>Bienvenido de nuevo 🍰</p>
    <input type="email" id="correo" placeholder="Correo electrónico">
    <input type="password" id="password" placeholder="Contraseña">
    <button class="btn" onclick="iniciarSesion()">Entrar</button>
    <div class="link">
      ¿No tienes cuenta? <a href="registro.html">Registrarse</a>
    </div>
  </div>
</div>

<script>
  async function iniciarSesion() {
    const correo = document.getElementById("correo").value.trim();
    const password = document.getElementById("password").value.trim();

    if (!correo || !password) {
      alert("❌ Por favor, completa todos los campos");
      return;
    }

    try {
      const res = await fetch("http://localhost:3000/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ correo, password })
      });

      if (res.ok) {
        const data = await res.json();
        alert(data.mensaje);
        
        localStorage.setItem("usuario", JSON.stringify({
          nombre: data.nombre,
          rol: data.rol,
          correo: correo
        }));

        if (data.rol === "Administrador") {
          window.location.href = "/admin";
        } else {
          window.location.href = "/cliente";
        }
      } else {
        const error = await res.text();
        alert("❌ " + error);
      }
    } catch (error) {
      alert("❌ Error de conexión: " + error.message);
    }
  }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - Pastelería</title>
  <!-- Fuentes de Google: Poppins para el texto general y Pacifico para el título -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&family=Pacifico&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    
    body {
      background: linear-gradient(135deg, #ffe6d9, #ffd6cc);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 20px;
    }

    /* Encabezado idéntico a la imagen */
    .header-text { text-align: center; margin-bottom: 25px; }
    .header-text .icon-cupcake { font-size: 2.5rem; color: #d35400; margin-bottom: 5px; }
    .header-text h1 { color: #7a3e2d; font-size: 1.8rem; font-weight: 500; line-height: 1.2; }
    .header-text h1 span { 
      display: block; 
      font-family: 'Pacifico', cursive; 
      color: #ff6f61; 
      font-size: 3.5rem; 
      font-weight: normal;
      margin-top: -5px;
    }
    .header-text p { color: #777; font-size: 1rem; margin-top: 10px; }

    /* Tarjeta blanca central */
    .card {
      background: #fff;
      width: 100%;
      max-width: 400px;
      border-radius: 30px;
      padding: 20px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.1);
    }

    /* Imagen del pastel dentro de la tarjeta */
    .card-image {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 20px;
      margin-bottom: 20px;
    }

    /* Campos de texto */
    .input-group { margin-bottom: 15px; }
    input {
      width: 100%;
      padding: 15px;
      border-radius: 15px;
      border: 1px solid #eee;
      background: #fafafa;
      outline: none;
      font-size: 1rem;
      transition: 0.3s;
    }
    input:focus { border-color: #ff6f61; background: #fff; }

    /* Botón idéntico al de la imagen (Rojo) */
    .btn {
      width: 100%;
      padding: 16px;
      background: #ff6f61;
      color: white;
      border: none;
      border-radius: 50px; /* Bordes muy redondeados tipo píldora */
      cursor: pointer;
      font-weight: 600;
      font-size: 1.1rem;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      box-shadow: 0 8px 20px rgba(255,111,97,0.3);
      transition: 0.2s;
      margin-top: 10px;
    }
    .btn:active { transform: scale(0.98); }
    .btn i { font-size: 1.2rem; }

    /* Separador con corazón */
    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 25px 0 15px 0;
      color: #ff6f61;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid #ffd6cc;
    }
    .divider i { margin: 0 10px; font-size: 0.9rem; }

    /* Link inferior */
    .link { text-align: center; font-size: 0.9rem; color: #777; }
    .link a { color: #ff6f61; text-decoration: none; font-weight: bold; }

  </style>
</head>
<body>

<div class="header-text">
  <i class="fas fa-birthday-cake icon-cupcake"></i>
  <h1>Bienvenido a la <span>Pastelería</span></h1>
  <p>Descubre los mejores postres 🍰</p>
</div>

<div class="card">
  <img src="https://images.unsplash.com/photo-1578985545062-69928b1d9587" class="card-image" alt="Pastel">
  
  <div class="input-group">
    <input type="email" id="correo" placeholder="Correo electrónico">
  </div>
  <div class="input-group">
    <input type="password" id="password" placeholder="Contraseña">
  </div>
  
  <button class="btn" onclick="iniciarSesion()">
    <i class="fas fa-user"></i> Entrar <i class="fas fa-arrow-right"></i>
  </button>
  
  <div class="divider"><i class="fas fa-heart"></i></div>
  
  <div class="link">
    ¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a>
  </div>
</div>

<script>
  async function iniciarSesion() {
    const correo = document.getElementById("correo").value.trim();
    const password = document.getElementById("password").value.trim();

    if (!correo || !password) {
      alert("❌ Completa todos los campos");
      return;
    }

    try {
      const res = await fetch("/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ correo, password })
      });

      if (res.ok) {
        const data = await res.json();
        alert(data.mensaje);
        localStorage.setItem("usuario", JSON.stringify({
          nombre: data.nombre,
          rol: data.rol,
          correo: correo
        }));
        if (data.rol === "Administrador") {
          window.location.href = "/admin";
        } else {
          window.location.href = "/cliente";
        }
      } else {
        const error = await res.json();
        alert("❌ " + (error.error || "Credenciales incorrectas"));
      }
    } catch (error) {
      alert("❌ Error de conexión con el servidor");
    }
  }
</script>
</body>
</html>

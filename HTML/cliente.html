<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Carrito - Pastelería</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&family=Pacifico&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body { background: linear-gradient(135deg, #ffe6d9, #ffd6cc); min-height: 100vh; padding: 20px; display: flex; flex-direction: column; align-items: center; }
    
    .app-container { width: 100%; max-width: 1100px; }
    
    .header-text { text-align: center; margin-bottom: 20px; }
    .header-text h1 { color: #7a3e2d; font-size: 1.5rem; }
    .header-text h1 span { display: block; font-family: 'Pacifico', cursive; color: #ff6f61; font-size: 3rem; margin-top: -5px; font-weight: normal; }
    
    .nav-bar { display: flex; justify-content: center; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; }
    .nav-bar a { text-decoration: none; padding: 10px 20px; border-radius: 50px; background: #fff; color: #7a3e2d; font-weight: 500; box-shadow: 0 4px 10px rgba(0,0,0,0.05); transition: 0.3s; }
    .nav-bar a:hover, .nav-bar a.active { background: #ff6f61; color: white; }
    .btn-salir { background: #e74c3c; color: white; border: none; padding: 10px 20px; border-radius: 50px; font-weight: bold; cursor: pointer; margin-left: 10px; }

    .main-content { display: flex; gap: 20px; }
    .productos-section { flex: 2; }
    .carrito-section { flex: 1; background: #fff; padding: 20px; border-radius: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); height: fit-content; }
    
    .productos-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
    .producto-card { background: #fff; border-radius: 25px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.08); display: flex; flex-direction: column; }
    .producto-img { width: 100%; height: 150px; object-fit: cover; }
    .producto-info { padding: 15px; display: flex; flex-direction: column; flex: 1; }
    .producto-nombre { font-size: 1.1rem; font-weight: bold; color: #7a3e2d; }
    .producto-precio { color: #ff6f61; font-weight: bold; font-size: 1.2rem; margin: 5px 0; }
    .btn-agregar { background: #f7b267; color: white; border: none; padding: 10px; border-radius: 50px; cursor: pointer; font-weight: bold; margin-top: 10px; }

    /* Carrito */
    .carrito-item { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
    .carrito-item img { width: 50px; height: 50px; border-radius: 10px; object-fit: cover; }
    .carrito-info { flex: 1; }
    .carrito-nombre { font-size: 0.9rem; font-weight: bold; color: #7a3e2d; }
    .carrito-precio { font-size: 0.85rem; color: #ff6f61; }
    .btn-pagar { width: 100%; padding: 15px; background: #ff6f61; color: white; border: none; border-radius: 50px; font-weight: bold; margin-top: 20px; cursor: pointer; }

    @media (max-width: 850px) { .main-content { flex-direction: column; } .productos-grid { grid-template-columns: 1fr; } .header-text h1 span { font-size: 2.5rem; } }
  </style>
</head>
<body>
<div class="app-container">
  <div class="header-text">
    <h1>Nuestros <span>Productos</span></h1>
  </div>
  
  <div class="nav-bar">
    <a href="/"><i class="fas fa-home"></i> Inicio</a>
    <a href="/menu-publico"><i class="fas fa-utensils"></i> Menú</a>
    <a href="/cliente" class="active"><i class="fas fa-shopping-bag"></i> Cliente</a>
    <button class="btn-salir" onclick="cerrarSesion()"><i class="fas fa-sign-out-alt"></i> Salir</button>
  </div>

  <div class="main-content">
    <div class="productos-section">
      <div id="productosContainer" class="productos-grid"></div>
    </div>
    <div class="carrito-section">
      <h2 style="color: #7a3e2d; margin-bottom: 15px; text-align: center;"><i class="fas fa-shopping-cart"></i> Mi Carrito</h2>
      <div id="carritoContainer"></div>
      <button class="btn-pagar" onclick="procederPago()">Pagar</button>
    </div>
  </div>
</div>

<script>
  let productos = [];
  let carrito = JSON.parse(localStorage.getItem('carrito')) || [];

  fetch('/productos').then(res => res.json()).then(data => {
    productos = data;
    document.getElementById('productosContainer').innerHTML = productos.map(p => `
      <div class="producto-card">
        <img class="producto-img" src="${p.imagenUrl || 'https://via.placeholder.com/300x150'}" onerror="this.src='https://via.placeholder.com/300x150'">
        <div class="producto-info">
          <div class="producto-nombre">${p.nombre}</div>
          <div class="producto-precio">$${p.precio.toFixed(2)}</div>
          <button class="btn-agregar" onclick="agregar('${p._id}')">Agregar al carrito</button>
        </div>
      </div>
    `).join('');
  });

  function agregar(id) {
    const p = productos.find(x => x._id === id);
    const ext = carrito.find(x => x._id === id);
    if (ext) ext.cantidad++; else carrito.push({ ...p, cantidad: 1 });
    localStorage.setItem('carrito', JSON.stringify(carrito));
    actualizarCarrito();
  }

  function actualizarCarrito() {
    const cont = document.getElementById('carritoContainer');
    if (carrito.length === 0) { cont.innerHTML = '<p style="text-align:center; color:#777;">Vacío</p>'; return; }
    cont.innerHTML = carrito.map((c, i) => `
      <div class="carrito-item">
        <img src="${c.imagenUrl || 'https://via.placeholder.com/50'}">
        <div class="carrito-info">
          <div class="carrito-nombre">${c.nombre} x${c.cantidad}</div>
          <div class="carrito-precio">$${(c.precio * c.cantidad).toFixed(2)}</div>
        </div>
        <button onclick="eliminar(${i})" style="background:#e74c3c; color:white; border:none; padding:5px 10px; border-radius:10px; cursor:pointer;">X</button>
      </div>
    `).join('');
  }

  function eliminar(i) { carrito.splice(i, 1); localStorage.setItem('carrito', JSON.stringify(carrito)); actualizarCarrito(); }
  function procederPago() { if (carrito.length === 0) alert('Carrito vacío'); else window.location.href = 'pago.html'; }
  function cerrarSesion() { localStorage.clear(); window.location.href = 'login.html'; }
  actualizarCarrito();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Cliente - Pastelería</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body { background: linear-gradient(135deg, #ffe6d9, #ffd6cc); padding: 20px; }
    .container { max-width: 1400px; margin: auto; background: white; border-radius: 25px; overflow: hidden; box-shadow: 0 15px 40px rgba(0,0,0,0.1); }
    .header { background: #fff9f7; padding: 20px 30px; border-bottom: 2px solid #ffe0d4; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
    .logo h2 { color: #7a3e2d; }
    .logo span { color: #ff6f61; }
    .usuario-info { display: flex; align-items: center; gap: 20px; }
    .cart-icon { position: relative; cursor: pointer; }
    .cart-icon i { font-size: 1.8rem; color: #ff6f61; }
    .cart-count { position: absolute; top: -8px; right: -12px; background: #e74c3c; color: white; border-radius: 50%; padding: 2px 8px; font-size: 12px; }
    .btn-cerrar { background: #ff6f61; color: white; border: none; padding: 8px 20px; border-radius: 40px; cursor: pointer; }
    .main-content { display: flex; min-height: 500px; }
    .productos-section { flex: 3; padding: 30px; }
    .carrito-section { flex: 1; background: #fff9f7; border-left: 2px solid #ffe0d4; padding: 30px; }
    .productos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px,1fr)); gap: 20px; margin-top: 20px; }
    .producto-card { background: #fffefc; border-radius: 20px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.08); cursor: pointer; transition: transform 0.2s; }
    .producto-card:hover { transform: translateY(-5px); }
    .producto-img { width: 100%; height: 150px; object-fit: cover; }
    .producto-info { padding: 15px; }
    .producto-nombre { font-size: 1.1rem; font-weight: bold; color: #7a3e2d; }
    .producto-precio { color: #ff6f61; font-weight: bold; margin: 8px 0; }
    .btn-agregar { background: #f7b267; color: white; border: none; padding: 8px; border-radius: 40px; width: 100%; cursor: pointer; margin-top: 10px; }
    .carrito-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #ffe0d4; }
    .carrito-total { margin-top: 20px; padding-top: 15px; border-top: 2px solid #ffe0d4; text-align: center; }
    .btn-pagar { background: #ff6f61; color: white; border: none; padding: 12px; border-radius: 40px; width: 100%; margin-top: 15px; cursor: pointer; font-weight: bold; }
    h3 { color: #7a3e2d; margin-bottom: 15px; }
   /* DISEÑO PARA CELULARES */
@media (max-width: 768px) {
  .main-content { flex-direction: column; } 
  .carrito-section { border-left: none; border-top: 2px solid #ffe0d4; }
  .productos-grid { grid-template-columns: 1fr; } 
  .header { flex-direction: column; text-align: center; gap: 10px; }
  .nav-buttons { justify-content: center; }
}
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="logo"><h2>🍰 <span>Pastelería</span> Delicia</h2></div>
    <div class="usuario-info">
      <span id="usuarioNombre"></span>
      <div class="cart-icon" onclick="toggleCarrito()">
        <i class="fas fa-shopping-cart"></i>
        <span class="cart-count" id="cartCount">0</span>
      </div>
      <button class="btn-cerrar" onclick="cerrarSesion()"><i class="fas fa-sign-out-alt"></i> Salir</button>
    </div>
  </div>
  <div class="main-content">
    <div class="productos-section">
      <h3><i class="fas fa-cake-candles"></i> Nuestros Productos</h3>
      <div id="productosContainer" class="productos-grid">Cargando...</div>
    </div>
    <div class="carrito-section" id="carritoSection">
      <h3><i class="fas fa-shopping-cart"></i> Mi Carrito</h3>
      <div id="carritoContainer"></div>
    </div>
  </div>
</div>
<script>
  const API_PRODUCTOS = '/productos';
  let productos = [];
  let carrito = JSON.parse(localStorage.getItem('carrito')) || [];

  const usuario = JSON.parse(localStorage.getItem('usuario'));
  if (usuario) {
    document.getElementById('usuarioNombre').innerHTML = `<i class="fas fa-user"></i> ${usuario.nombre}`;
  } else {
    window.location.href = 'login.html';
  }

  async function cargarProductos() {
    try {
      const res = await fetch(API_PRODUCTOS);
      productos = await res.json();
      renderizarProductos();
    } catch (error) {
      document.getElementById('productosContainer').innerHTML = '<p>Error cargando productos</p>';
    }
  }

  function renderizarProductos() {
    const container = document.getElementById('productosContainer');
    if (productos.length === 0) {
      container.innerHTML = '<p>No hay productos disponibles</p>';
      return;
    }
    container.innerHTML = productos.map(p => `
      <div class="producto-card" onclick="verDetalle('${p._id}')">
        <img class="producto-img" src="${p.imagenUrl || 'https://via.placeholder.com/250x150'}" onerror="this.src='https://via.placeholder.com/250x150'">
        <div class="producto-info">
          <div class="producto-nombre">${escapeHtml(p.nombre)}</div>
          <div class="producto-precio">$${p.precio.toFixed(2)}</div>
          <button class="btn-agregar" onclick="event.stopPropagation(); agregarAlCarrito('${p._id}')"><i class="fas fa-plus"></i> Agregar</button>
        </div>
      </div>
    `).join('');
  }

  function verDetalle(id) {
    window.location.href = `detalle-producto.html?id=${id}`;
  }

  function agregarAlCarrito(id) {
    const producto = productos.find(p => p._id === id);
    if (!producto) return;
    const existente = carrito.find(item => item.id === id);
    if (existente) {
      existente.cantidad++;
    } else {
      carrito.push({ id: producto._id, nombre: producto.nombre, precio: producto.precio, cantidad: 1, imagen: producto.imagenUrl });
    }
    localStorage.setItem('carrito', JSON.stringify(carrito));
    actualizarCarrito();
  }

  function actualizarCarrito() {
    const container = document.getElementById('carritoContainer');
    const count = carrito.reduce((sum, item) => sum + item.cantidad, 0);
    document.getElementById('cartCount').innerText = count;
    
    if (carrito.length === 0) {
      container.innerHTML = '<div class="carrito-vacio">Carrito vacío</div>';
      return;
    }
    
    let total = 0;
    container.innerHTML = carrito.map((item, idx) => {
      total += item.precio * item.cantidad;
      return `
        <div class="carrito-item">
          <span>${item.nombre} x ${item.cantidad}</span>
          <span>$${(item.precio * item.cantidad).toFixed(2)}</span>
          <button onclick="eliminarDelCarrito(${idx})" style="background:#e74c3c; color:white; border:none; border-radius:5px; padding:2px 8px;">X</button>
        </div>
      `;
    }).join('');
    
    container.innerHTML += `
      <div class="carrito-total">
        <strong>Total: $${total.toFixed(2)}</strong>
        <button class="btn-pagar" onclick="procederPago()"><i class="fas fa-credit-card"></i> Pagar</button>
      </div>
    `;
  }

  function eliminarDelCarrito(idx) {
    carrito.splice(idx, 1);
    localStorage.setItem('carrito', JSON.stringify(carrito));
    actualizarCarrito();
  }

  function toggleCarrito() {
    const section = document.getElementById('carritoSection');
    section.style.display = section.style.display === 'none' ? 'block' : 'none';
  }

  function procederPago() {
    if (carrito.length === 0) {
      alert('Tu carrito está vacío');
      return;
    }
    window.location.href = 'pago.html';
  }

  function cerrarSesion() {
    localStorage.removeItem('usuario');
    localStorage.removeItem('carrito');
    window.location.href = 'login.html';
  }

  function escapeHtml(str) {
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }

  cargarProductos();
  actualizarCarrito();
</script>
</body>
</html>

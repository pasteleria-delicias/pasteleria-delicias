<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Pastelería</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body {
      background: linear-gradient(135deg, #ffe6d9, #ffd6cc);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      width: 900px;
      background: #fff;
      border-radius: 25px;
      overflow: hidden;
      box-shadow: 0 15px 40px rgba(0,0,0,0.2);
    }
    .left {
      background: url('https://images.unsplash.com/photo-1578985545062-69928b1d9587') center/cover;
      position: relative;
    }
    .left::after {
      content: "";
      position: absolute;
      width: 100%;
      height: 100%;
      background: rgba(255, 150, 150, 0.3);
    }
    .right { padding: 40px; text-align: center; }
    h1 { color: #7a3e2d; margin-bottom: 10px; }
    h1 span { color: #ff6f61; font-weight: bold; }
    p { color: #555; margin-bottom: 25px; }
    .btn {
      display: block;
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
    }
    .login { background: #ff6f61; color: white; }
    .registro { background: #f7b267; color: white; }
    .footer { margin-top: 20px; font-size: 12px; color: #aaa; }
  </style>
</head>
<body>
  <div class="container">
    <div class="left"></div>
    <div class="right">
      <h1>Bienvenido a la <span>Pastelería</span></h1>
      <p>Descubre los mejores postres 🍰</p>
      <button class="btn login" onclick="location.href='login.html'">Iniciar Sesión</button>
      <button class="btn registro" onclick="location.href='registro.html'">Registrarse</button>
      <div class="footer">❤️ Gracias por elegirnos</div>
    </div>
  </div>
</body>
</html>
